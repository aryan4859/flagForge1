name: CI Build Check

on:
  push:
    branches: [ "main", "mainv2"]
  pull_request:
    branches: [ "main", "mainv2"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js Latest
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        # Removed cache: 'npm' to avoid requiring package-lock.json
        
    - name: Install dependencies
      run: npm install
      
    - name: Lint check
      run: npm run lint
      continue-on-error: true # Allow build to continue even if lint fails, as it's often a separate concern
      
    - name: Build project
      run: npm run build
      env:
        # Add necessary build-time environment variables here
        NEXT_PUBLIC_SITE_URL: https://flagforge.xyz
        MONGO_URL: ${{ secrets.MONGO_URL || 'mongodb://localhost:27017/flagforge' }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder-secret' }}
        NEXTAUTH_URL: https://flagforge.xyz
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || 'placeholder-key' }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID || 'placeholder-id' }}
